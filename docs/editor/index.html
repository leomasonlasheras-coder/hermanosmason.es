<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elige el estilo de tu web · Hermanos Mason</title>
<meta name="robots" content="noindex">

<link rel="stylesheet" href="../temas/fuentes.css">
<link rel="stylesheet" href="editor.css">
</head>
<body>

<header class="cabecera">
  <p class="cabecera__marca">Hermanos Mason</p>
  <h1 class="cabecera__titulo">Elige el estilo de tu web</h1>
  <p class="cabecera__texto">Pasa por los estilos y mira cómo cambia tu web, en ordenador y en móvil. Cuando uno te guste, pídelo y lo dejamos puesto.</p>
</header>

<main class="editor">

  <div class="mandos">
    <span class="pasar__cuenta" id="cuenta">— de —</span>
    <button type="button" class="pasar__texto" id="sorpresa">Sorpréndeme</button>
    <button type="button" class="pasar__texto" id="volver" hidden>Volver al mío</button>
    <p class="estado" id="estado" aria-live="polite">Cargando tu web…</p>
  </div>

  <section class="escenario" aria-label="Tu web con el estilo elegido">
  <button type="button" class="flecha" id="anterior" aria-label="Estilo anterior" title="Anterior (flecha izquierda)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
  <div class="aparatos">
    <div class="ordenador" aria-hidden="true">
      <div class="ordenador__marco">
        <div class="ordenador__barra"><span class="ordenador__puntos"></span><span class="ordenador__url" id="url-ordenador"></span></div>
        <div class="pantalla pantalla--ordenador" data-base="1280"><iframe class="web" data-aparato="ordenador" title="Tu web en ordenador" scrolling="no"></iframe></div>
      </div>
      <div class="ordenador__base"></div>
    </div>
    <div class="movil" aria-hidden="true">
      <div class="pantalla pantalla--movil" data-base="390"><iframe class="web" data-aparato="movil" title="Tu web en móvil" scrolling="no"></iframe></div>
    </div>
  </div>
  <button type="button" class="flecha" id="siguiente" aria-label="Estilo siguiente" title="Siguiente (flecha derecha)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
  </section>

  <section class="estilos" aria-label="Estilos">
    <h2 class="estilos__titulo">Nuestros estilos</h2>
    <ol class="estilos__lista" id="lista"></ol>
  </section>

</main>

<footer class="pedir">
  <p class="pedir__texto">Estilo elegido: <strong id="elegido">—</strong></p>
  <a class="boton" id="pedir" href="#" target="_blank" rel="noopener" aria-disabled="true">Quiero este estilo</a>
</footer>

<template id="plantilla-estilo">
  <li class="estilos__item">
    <button type="button" class="estilo" aria-pressed="false">
      <span class="mock" aria-hidden="true">
        <span class="mock__barra"><span class="mock__marca">Tu negocio</span><span class="mock__punto"></span></span>
        <span class="mock__titulo">Una hora para ti</span>
        <span class="mock__linea"></span>
        <span class="mock__boton">Reserva</span>
        <span class="mock__foto"></span>
      </span>
      <span class="estilo__nombre"><span class="estilo__texto"></span><span class="estilo__tuyo" hidden>El tuyo</span></span>
    </button>
  </li>
</template>

<script src="editor.js"></script>
</body>
</html>
