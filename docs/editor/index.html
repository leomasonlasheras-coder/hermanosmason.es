<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elige el estilo de tu web · Hermanos Mason</title>
<meta name="robots" content="noindex">

<link rel="stylesheet" href="../temas/fuentes.css">
<link rel="stylesheet" href="editor.css">
</head>
<body>

<header class="cabecera">
  <p class="cabecera__marca">Hermanos Mason</p>
  <h1 class="cabecera__titulo">Elige el estilo de tu web</h1>
  <p class="cabecera__texto">Pasa por los estilos y mira cómo cambia tu web, en ordenador y en móvil. Cuando uno te guste, pídelo y lo dejamos puesto.</p>
</header>

<main class="editor">

  <section class="escenario" aria-label="Tu web con el estilo elegido">
  <button type="button" class="flecha" id="anterior" aria-label="Estilo anterior" title="Anterior (flecha izquierda)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
  <div class="aparatos">
    <p class="aviso" id="estado" role="status" aria-live="polite">Cargando tu web…</p>
    <div class="ordenador">
      <div class="ordenador__tapa">
        <div class="pantalla pantalla--ordenador" data-base="1280">
          <iframe class="web" data-aparato="ordenador" title="Tu web en ordenador" aria-hidden="true" tabindex="-1" sandbox="allow-scripts allow-same-origin"></iframe>
          <div class="pantalla__capa" data-para="ordenador" title="Rueda o arrastra para recorrer tu web"></div>
        </div>
      </div>
      <div class="ordenador__base"><span class="ordenador__muesca"></span></div>
    </div>
    <div class="mapa" title="Tu web entera: pulsa o arrastra para ir a una parte">
      <div class="mapa__pantalla">
        <iframe class="web web--mapa" data-aparato="mapa" title="Mapa de tu web" aria-hidden="true" tabindex="-1" sandbox="allow-scripts allow-same-origin"></iframe>
        <div class="mapa__resalto" aria-hidden="true"></div>
        <div class="mapa__capa"></div>
      </div>
    </div>
    <div class="movil">
      <span class="movil__botones" aria-hidden="true"></span>
      <div class="pantalla pantalla--movil" data-base="390">
        <iframe class="web" data-aparato="movil" title="Tu web en móvil" aria-hidden="true" tabindex="-1" sandbox="allow-scripts allow-same-origin"></iframe>
        <div class="pantalla__capa" data-para="movil" title="Rueda o arrastra para recorrer tu web"></div>
        <div class="pantalla__scroll" aria-hidden="true"><span class="pantalla__pulgar"></span></div>
      </div>
    </div>
  </div>
  <button type="button" class="flecha" id="siguiente" aria-label="Estilo siguiente" title="Siguiente (flecha derecha)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
  </section>

  <section class="estilos" aria-label="Estilos">
    <p class="estilos__cuenta"><span id="cuenta">— de —</span><button type="button" class="estilos__volver" id="volver" hidden>Volver al mío</button></p>
    <div class="estilos__fila">
      <div class="vistas" role="group" aria-label="Verla como en">
        <button type="button" class="vista-btn" data-vista="ordenador" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M1.5 19.5h21"/></svg>Ordenador</button>
        <button type="button" class="vista-btn" data-vista="movil" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M10.5 18.5h3"/></svg>Móvil</button>
      </div>
      <ol class="estilos__lista" id="lista"></ol>
      <a class="boton" id="pedir" href="#" target="_blank" rel="noopener" aria-disabled="true">Quiero este estilo</a>
    </div>
  </section>

</main>

<template id="plantilla-estilo">
  <li class="estilos__item">
    <button type="button" class="estilo" aria-pressed="false">
      <span class="mock" aria-hidden="true">
        <span class="mock__barra"><span class="mock__marca">Tu negocio</span><span class="mock__punto"></span></span>
        <span class="mock__titulo">Una hora para ti</span>
        <span class="mock__linea"></span>
        <span class="mock__boton">Reserva</span>
        <span class="mock__foto"></span>
      </span>
      <span class="estilo__nombre"><span class="estilo__texto"></span><span class="estilo__tuyo" hidden>El tuyo</span></span>
    </button>
  </li>
</template>

<script src="editor.js"></script>
</body>
</html>
